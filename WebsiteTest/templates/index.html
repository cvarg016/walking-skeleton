<!doctype html>
<html>
  <head>
    <title>Walking Skeleton</title>
    <style>
      body {
        font-family: sans-serif;
        padding: 2rem;
      }

      .board {
        display: flex;
        gap: 2rem;
      }

      .column {
        flex: 1;
        background: #f4f4f4;
        padding: 1rem;
        border-radius: 8px;
        min-height: 300px;
      }

      .card {
        background: white;
        padding: 1rem;
        margin-bottom: 1rem;
        border-radius: 6px;
        cursor: grab;
      }

      .card:active {
        cursor: grabbing;
      }

      .column.drag-over {
        background: #ddd;
      }
    </style>
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
  </head>

  <body>
    <h1>Walking Skeleton</h1>

    <div class="board">
      <div class="column" data-column="todo">
        <h2>To Do</h2>

        {% for card in cards %} {% if card["col"] == "todo" %}
        <div class="card" draggable="true" data-card-id="{{ card['id'] }}">
          {{ card["title"] }}
        </div>
        {% endif %} {% endfor %}
      </div>

      <div class="column" data-column="in_progress">
        <h2>In Progress</h2>

        {% for card in cards %} {% if card["col"] == "in_progress" %}
        <div class="card" draggable="true" data-card-id="{{ card['id'] }}">
          {{ card["title"] }}
        </div>
        {% endif %} {% endfor %}
      </div>
    </div>

    <script>
      const socket = io();

      socket.on("card_moved", (data) => {
        const card = document.querySelector(
          `.card[data-card-id="${data.card_id}"]`,
        );
        const targetColumn = document.querySelector(
          `.column[data-column="${data.new_col}"]`,
        );

        if (card && targetColumn && card.parentElement !== targetColumn) {
          targetColumn.appendChild(card);
        }
      });

      let draggedCard = null;

      // When dragging starts
      document.querySelectorAll(".card").forEach((card) => {
        card.addEventListener("dragstart", () => {
          draggedCard = card;
        });
      });

      // Allow cards to be dropped into columns
      document.querySelectorAll(".column").forEach((column) => {
        column.addEventListener("dragover", (event) => {
          event.preventDefault();
          column.classList.add("drag-over");
        });

        column.addEventListener("dragleave", () => {
          column.classList.remove("drag-over");
        });

        column.addEventListener("drop", async (event) => {
          event.preventDefault();
          column.classList.remove("drag-over");

          if (!draggedCard) {
            return;
          }

          const cardId = draggedCard.dataset.cardId;

          column.appendChild(draggedCard);

          fetch("/move", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
            },
            body: JSON.stringify({
              card_id: cardId,
            }),
          });

          draggedCard = null;
        });
      });
    </script>
  </body>
</html>
